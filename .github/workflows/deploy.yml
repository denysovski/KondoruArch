name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo, mint an id-token for the deployment, and
# write the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling, so a
# half-finished upload never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pages serves a project site from /<repo>, so every route and asset
      # has to be built with that prefix.
      NEXT_PUBLIC_BASE_PATH: /KondoruArch
      NEXT_PUBLIC_SITE_URL: https://denysovski.github.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type check, build the static export, then audit the export itself:
      # alt text, canonicals, structured data, internal links, the sitemap.
      - run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
